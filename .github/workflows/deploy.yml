name: Deploy Triangle Peg to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test peg game rules
        run: npm test

      - name: Build Angular for GitHub Pages
        run: npm run build -- --base-href /TrianglePeg/

      - name: Prepare static website
        run: |
          # Avoid Jekyll processing even if hosting source settings change.
          touch dist/triangle-peg/browser/.nojekyll
          test -f dist/triangle-peg/browser/index.html
          test -f dist/triangle-peg/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/triangle-peg/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
